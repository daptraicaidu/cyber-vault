<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cyber Vault</title>
    <style>
        :root {
            --bg: #1e1e2e;
            --surface: #2a2b3d;
            --dropdown-bg: #313244;
            --text: #cdd6f4;
            --accent: #89b4fa;
            --danger: #f38ba8;
            --warning: #f9e2af;
        }
        body.light-mode {
            --bg: #f5f5f5;
            --surface: #ffffff;
            --dropdown-bg: #f8f9fa;
            --text: #333333;
            --accent: #007bff;
            --danger: #dc3545;
            --warning: #ffc107;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg); color: var(--text);
            margin: 0; display: flex; flex-direction: column; height: 100vh;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #45475a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #585b70; }
        body.light-mode ::-webkit-scrollbar-track { background: #e0e0e0; }
        body.light-mode ::-webkit-scrollbar-thumb { background: #adb5bd; }
        body.light-mode ::-webkit-scrollbar-thumb:hover { background: #6c757d; }
        
        /* Header */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 30px; background-color: var(--surface);
            border-bottom: 1px solid #45475a;
        }
        .header h1 { margin: 0; font-size: 24px; color: var(--accent); }
        .toggles { display: flex; gap: 10px; }
        .toggle-btn {
            background: var(--bg); color: var(--text); border: 1px solid #45475a;
            padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        
        /* Layout */
        .content-wrapper { display: flex; flex: 1; overflow: hidden; }
        
        /* Sidebar Filter */
        .sidebar {
            width: 400px; background-color: var(--surface); padding: 20px;
            border-right: 1px solid #45475a; display: flex; flex-direction: column; gap: 15px;
        }
        .search-container { position: relative; }
        .sidebar input, .sidebar select {
            width: 100%; box-sizing: border-box;
            padding: 10px; border-radius: 5px; border: 1px solid #45475a;
            background: var(--bg); color: var(--text); outline: none;
        }
        
        /* Dropdown */
        .dropdown {
            position: absolute; top: 100%; left: 0; right: 0;
            background: var(--dropdown-bg); border: 1px solid #45475a;
            border-radius: 5px; margin-top: 5px; padding: 0;
            list-style: none; max-height: 400px; overflow-y: auto;
            z-index: 10; display: none; box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }
        body.light-mode .dropdown { box-shadow: 0 8px 16px rgba(0,0,0,0.15); border: 1px solid #ddd; }
        .dropdown li {
            padding: 12px; cursor: pointer; border-bottom: 1px solid #45475a; display: flex; flex-direction: column; gap: 6px;
        }
        body.light-mode .dropdown li { border-bottom: 1px solid #eee; }
        .dropdown li:hover { background: var(--bg); border-left: 3px solid var(--accent); padding-left: 9px; }
        .dropdown li:last-child { border-bottom: none; }

        /* Main Content */
        .main { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; }
        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; flex: 1; align-content: flex-start;
        }
        .card {
            background: var(--surface); padding: 20px; border-radius: 10px;
            cursor: pointer; transition: transform 0.2s, border 0.2s; border: 1px solid transparent;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .badge {
            display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-bottom: 10px;
        }
        .badge.High { background: var(--warning); color: #000; }
        .badge.Critical { background: var(--danger); color: #000; }
        .badge.Medium { background: #a6e3a1; color: #000; }
        .date-badge {
            display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-left: 8px;
            vertical-align: middle;
        }
        .date-badge.new { background: var(--danger); color: #000; }
        .date-badge.recent { background: var(--warning); color: #000; }
        
        /* Pagination */
        .pagination { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 20px; }
        .pagination button {
            background: var(--surface); color: var(--text); border: 1px solid #45475a;
            padding: 8px 15px; border-radius: 5px; cursor: pointer;
        }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content {
            background: var(--bg); width: 60%; max-height: 80vh; border-radius: 12px;
            padding: 30px; overflow-y: auto; position: relative; border: 1px solid #45475a;
            word-wrap: break-word;
        }
        .close-btn { position: absolute; top: 15px; right: 20px; cursor: pointer; font-size: 24px; color: var(--danger);}

        /* Modal Groups & Sections */
        .group-container {
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 10px;
            border: 1px solid #45475a;
        }
        body.light-mode .group-container { background: rgba(0, 0, 0, 0.05); }
        
        .group-title {
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 1px solid #45475a;
            padding-bottom: 10px;
        }
        body.light-mode .group-title { border-bottom: 1px solid #ccc; }
        
        .section-box { 
            margin-bottom: 15px; 
            padding-left: 10px;
            border-left: 3px solid #89b4fa;
        }
        .section-box:last-child { margin-bottom: 0; }
        .section-box h3 { color: #cdd6f4; font-size: 16px; margin: 0 0 8px 0; }
        body.light-mode .section-box h3 { color: #333; }
        .section-box p, .section-box ul, .section-box ol { margin: 0; color: #a6adc8; }
        body.light-mode .section-box p, body.light-mode .section-box ul, body.light-mode .section-box ol { color: #555; }
        .section-box pre { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 5px; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word; margin: 0; }
        .section-box code { font-family: Consolas, monospace; }
        
        .download-group { margin-bottom: 20px; display: flex; gap: 10px; }
        .btn { padding: 8px 15px; border-radius: 5px; text-decoration: none; font-weight: bold; cursor: pointer; border: none;}
        .btn-md { background: #313244; color: #cdd6f4; }
        body.light-mode .btn-md { background: #e0e0e0; color: #333; }
        .btn-json { background: var(--accent); color: #000; }

        /* Doc & Feedback Modal */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #45475a; padding-bottom: 10px; padding-right: 40px; }
        .tab-btn { flex: 1; padding: 12px; background: transparent; color: var(--text); border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        .tab-btn:hover { background: rgba(137, 180, 250, 0.1); }
        .tab-btn.active { background: var(--accent); color: #000; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--accent); }
        .form-group input, .form-group textarea { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 8px; border: 1px solid #45475a; background: var(--bg); color: var(--text); font-family: inherit; }
        .form-group textarea { resize: vertical; min-height: 100px; }
        .submit-btn { background: var(--accent); color: #000; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; transition: 0.2s;}
        .submit-btn:hover { opacity: 0.9; }

        /* Footer */
        .footer { padding: 15px 30px; text-align: center; background-color: var(--surface); border-top: 1px solid #45475a; color: #a6adc8; font-size: 14px; }

        @media (max-width: 768px) {
            .content-wrapper { flex-direction: column; }
            .sidebar { width: auto; border-right: none; border-bottom: 1px solid #45475a; }
            .modal-content { width: 95%; padding: 20px; }
            .header { flex-direction: column; gap: 15px; }
            .group-container { padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Cyber Vault</h1>
        <div class="toggles">
            <button id="docToggle" class="toggle-btn" onclick="openDocModal()">Tài liệu</button>
            <button id="themeToggle" class="toggle-btn">🌙 Dark</button>
            <button id="langToggle" class="toggle-btn">🇻🇳 VI</button>
        </div>
    </div>

    <div class="content-wrapper">
        <div class="sidebar">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Tìm kiếm lỗ hổng...">
                <ul id="searchDropdown" class="dropdown"></ul>
            </div>
            <select id="severityFilter">
                <option value="">Tất cả mức độ</option>
                <option value="Low">Thấp</option>
                <option value="Medium">Trung bình</option>
                <option value="Medium to High">Trung bình đến Cao</option>
                <option value="High">Cao</option>
                <option value="High to Critical">Cao đến Nghiêm trọng</option>
                <option value="Critical">Nghiêm trọng</option>
            </select>
        </div>

        <div class="main">
            <div class="grid" id="vaultGrid"></div>
            <div class="pagination" id="paginationControls">
                <button id="prevPage">⬅️ Prev</button>
                <span id="pageInfo">Page 1 / 1</span>
                <button id="nextPage">Next ➡️</button>
            </div>
        </div>
    </div>

    <div class="footer" id="appFooter">
        &copy; 2026 Cyber Vault. All rights reserved.
    </div>

    <div class="modal" id="docModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeDocModal()">&times;</span>
            <div class="tabs">
                <button class="tab-btn active" id="tabDocBtn" onclick="switchTab('doc')">Tài liệu</button>
                <button class="tab-btn" id="tabFeedbackBtn" onclick="switchTab('feedback')">Góp ý</button>
            </div>
            
            <div id="tab-doc" class="tab-content active">
                <div id="docLoading">Đang tải...</div>
                <div id="docContent" style="display: none;">
                    <h1 id="docProjectName" style="color: var(--accent); margin-top: 0;"></h1>
                    <p id="docProjectDesc" style="color: #a6adc8;"></p>
                    <p style="font-size: 12px; color: #6c7086;" id="docLastUpdated"></p>
                    <hr style="border: 0; border-top: 1px solid #45475a; margin: 20px 0;">
                    <h2 id="docMsgTitle" style="color: #cba6f7;"></h2>
                    <div id="docMsgContent" class="section-box" style="border-left-color: #cba6f7;"></div>
                </div>
            </div>

            <div id="tab-feedback" class="tab-content">
                <form id="feedbackForm" onsubmit="submitFeedback(event)">
                    <div class="form-group">
                        <label id="lblFeedbackTitle" for="fbTitle">Tiêu đề</label>
                        <input type="text" id="fbTitle" required>
                    </div>
                    <div class="form-group">
                        <label id="lblFeedbackContent" for="fbContent">Nội dung</label>
                        <textarea id="fbContent" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn" id="btnSubmitFeedback">Gửi Feedback</button>
                </form>
            </div>
        </div>
    </div>

    <div class="modal" id="detailModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h1 id="m-title" style="color: var(--accent); margin-top: 0; padding-right: 35px;"></h1>
            <div class="download-group">
                <a href="#" id="dl-md" class="btn btn-md">📥 Tải Markdown</a>
                <a href="#" id="dl-json" class="btn btn-json">📥 Tải JSON</a>
            </div>
            
            <div id="modalSections"></div>
        </div>
    </div>

    <script>
        const API_BASE = "/api/vault";
        
        // State
        let currentLang = localStorage.getItem('lang') || 'vi';
        let currentTheme = localStorage.getItem('theme') || 'dark';
        let currentPage = 1;
        let totalPages = 1;
        const detailCache = {};
        let searchTimeout;

        // Translations
        const dict = {
            vi: {
                docBtn: "Tài liệu",
                tabDoc: "Tài liệu",
                tabFeedback: "Góp ý",
                fbTitle: "Tiêu đề",
                fbContent: "Nội dung",
                fbSubmit: "Gửi Feedback",
                docLoading: "Đang tải...",
                searchPlaceholder: "Tìm kiếm lỗ hổng...",
                dateAdded: "Ngày thêm",
                badgeNew: "Mới",
                badgeRecent: "Gần đây",
                filters: {
                    all: "Tất cả mức độ",
                    low: "Thấp",
                    med: "Trung bình",
                    medHigh: "Trung bình đến Cao",
                    high: "Cao",
                    highCrit: "Cao đến Nghiêm trọng",
                    crit: "Nghiêm trọng"
                },
                downloadMd: "📥 Tải Markdown",
                downloadJson: "📥 Tải JSON",
                prev: "⬅️ Trước",
                next: "Sau ➡️",
                page: "Trang",
                groups: {
                    identification: "🆔 Nhận diện",
                    understanding: "🧠 Hiểu về lỗ hổng",
                    exploitation: "⚔️ Khai thác",
                    defense: "🛡️ Phòng thủ",
                    lab: "🧪 Thực hành Lab",
                    meta: "📚 Tham khảo & Meta"
                },
                fields: {
                    category: "Danh mục",
                    cwe: "CWE",
                    cve: "CVE",
                    severity: "Mức độ",
                    description: "Mô tả",
                    root_cause: "Nguyên nhân gốc rễ",
                    mechanism: "Cơ chế hoạt động",
                    affected_systems: "Hệ thống bị ảnh hưởng",
                    affected_components: "Thành phần bị ảnh hưởng",
                    impact: "Tác động",
                    attack_surface: "Bề mặt tấn công",
                    variants: "Biến thể",
                    exploit_prerequisites: "Điều kiện tiền đề",
                    exploit_flow: "Luồng khai thác",
                    exploit_payloads: "Payloads",
                    defense_mitigation: "Giảm thiểu",
                    defense_best_practices: "Thực hành tốt nhất",
                    defense_detection: "Phát hiện",
                    defense_common_mistakes: "Lỗi phổ biến",
                    lab_setup: "Cài đặt Lab",
                    lab_steps: "Các bước Lab",
                    lab_verification: "Xác minh Lab",
                    references: "Tài liệu tham khảo",
                    meta_difficulty: "Độ khó",
                    meta_frequency: "Tần suất",
                    meta_tags: "Tags",
                    meta_notes: "Ghi chú",
                    meta_related: "Liên quan"
                }
            },
            en: {
                docBtn: "DOC",
                tabDoc: "DOC",
                tabFeedback: "Feedback",
                fbTitle: "Title",
                fbContent: "Content",
                fbSubmit: "Submit Feedback",
                docLoading: "Loading...",
                searchPlaceholder: "Search vulnerabilities...",
                dateAdded: "Added",
                badgeNew: "New",
                badgeRecent: "Recent",
                filters: {
                    all: "All severities",
                    low: "Low",
                    med: "Medium",
                    medHigh: "Medium to High",
                    high: "High",
                    highCrit: "High to Critical",
                    crit: "Critical"
                },
                downloadMd: "📥 Download Markdown",
                downloadJson: "📥 Download JSON",
                prev: "⬅️ Prev",
                next: "Next ➡️",
                page: "Page",
                groups: {
                    identification: "🆔 Identification",
                    understanding: "🧠 Understanding",
                    exploitation: "⚔️ Exploitation",
                    defense: "🛡️ Defense",
                    lab: "🧪 Lab Setup",
                    meta: "📚 References & Meta"
                },
                fields: {
                    category: "Category",
                    cwe: "CWE",
                    cve: "CVE",
                    severity: "Severity",
                    description: "Description",
                    root_cause: "Root Cause",
                    mechanism: "Mechanism",
                    affected_systems: "Affected Systems",
                    affected_components: "Affected Components",
                    impact: "Impact",
                    attack_surface: "Attack Surface",
                    variants: "Variants",
                    exploit_prerequisites: "Prerequisites",
                    exploit_flow: "Exploit Flow",
                    exploit_payloads: "Payloads",
                    defense_mitigation: "Mitigation",
                    defense_best_practices: "Best Practices",
                    defense_detection: "Detection",
                    defense_common_mistakes: "Common Mistakes",
                    lab_setup: "Lab Setup",
                    lab_steps: "Lab Steps",
                    lab_verification: "Lab Verification",
                    references: "References",
                    meta_difficulty: "Difficulty",
                    meta_frequency: "Frequency",
                    meta_tags: "Tags",
                    meta_notes: "Notes",
                    meta_related: "Related"
                }
            }
        };

        // Initialize Theme & Language
        function initThemeLang() {
            document.documentElement.lang = currentLang;
            if (currentTheme === 'light') document.body.classList.add('light-mode');
            updateUIStrings();
            
            document.getElementById('themeToggle').addEventListener('click', () => {
                currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
                localStorage.setItem('theme', currentTheme);
                document.body.classList.toggle('light-mode');
                updateUIStrings();
            });

            document.getElementById('langToggle').addEventListener('click', () => {
                currentLang = currentLang === 'vi' ? 'en' : 'vi';
                localStorage.setItem('lang', currentLang);
                updateUIStrings();
                currentPage = 1;
                fetchVault();
            });
        }

        function updateUIStrings() {
            const t = dict[currentLang];
            document.getElementById('themeToggle').innerText = currentTheme === 'dark' ? '🌙 Dark' : '☀️ Light';
            document.getElementById('langToggle').innerText = currentLang === 'vi' ? '🇻🇳 VI' : '🇬🇧 EN';
            document.getElementById('docToggle').innerText = t.docBtn;
            document.getElementById('tabDocBtn').innerText = t.tabDoc;
            document.getElementById('tabFeedbackBtn').innerText = t.tabFeedback;
            document.getElementById('lblFeedbackTitle').innerText = t.fbTitle;
            document.getElementById('lblFeedbackContent').innerText = t.fbContent;
            document.getElementById('btnSubmitFeedback').innerText = t.fbSubmit;
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            
            const sel = document.getElementById('severityFilter');
            sel.options[0].text = t.filters.all;
            sel.options[1].text = t.filters.low;
            sel.options[2].text = t.filters.med;
            sel.options[3].text = t.filters.medHigh;
            sel.options[4].text = t.filters.high;
            sel.options[5].text = t.filters.highCrit;
            sel.options[6].text = t.filters.crit;

            document.getElementById('dl-md').innerText = t.downloadMd;
            document.getElementById('dl-json').innerText = t.downloadJson;
            document.getElementById('prevPage').innerText = t.prev;
            document.getElementById('nextPage').innerText = t.next;
            updatePageInfo();
        }

        // Search Debounce & Dropdown
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value.trim();
            clearTimeout(searchTimeout);
            
            if (!q) {
                document.getElementById('searchDropdown').style.display = 'none';
                currentPage = 1;
                fetchVault();
                return;
            }

            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`${API_BASE}/search?q=${encodeURIComponent(q)}&lang=${currentLang}`);
                    const results = await res.json();
                    const dropdown = document.getElementById('searchDropdown');
                    
                    if (results.length > 0) {
                        dropdown.innerHTML = results.map(r => {
                            const dateInfo = processDateInfo(r.date_added);
                            const t = dict[currentLang];
                            const dateHtml = dateInfo.formatted ? `<span style="font-size:12px; color:#a6adc8;">${t.dateAdded}: ${dateInfo.formatted}</span>` : '';
                            const badgeHtml = dateInfo.hasBadge ? `<span class="date-badge ${dateInfo.badgeText === t.badgeNew ? 'new' : 'recent'}">${dateInfo.badgeText}</span>` : '';
                            
                            const sevRaw = (r.severity || '').toLowerCase();
                            let severClass = "Medium";
                            if (sevRaw.includes("critical") || sevRaw.includes("nghiêm trọng") || sevRaw.includes("nghiem trong")) severClass = "Critical";
                            else if (sevRaw.includes("high") || sevRaw.includes("cao")) severClass = "High";

                            return `<li onclick="selectSearchResult(${r.id}, '${r.slug}')">
                                <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                                    <strong style="color:var(--text);">${r.title}</strong>
                                    <div style="display:flex; align-items:center;">
                                        <span class="badge ${severClass}" style="margin-bottom:0; font-size:10px; padding:2px 6px;">${r.severity || 'N/A'}</span>
                                        ${badgeHtml}
                                    </div>
                                </div>
                                <div style="display:flex; justify-content:space-between; margin-top:2px;">
                                    <span style="font-size:12px; color:#a6adc8;">${r.category || ''}</span>
                                    ${dateHtml}
                                </div>
                            </li>`;
                        }).join('');
                        dropdown.style.display = 'block';
                    } else {
                        dropdown.style.display = 'none';
                    }

                    // Update main grid as well
                    currentPage = 1;
                    fetchVault();
                } catch (err) {
                    console.error("Search failed:", err);
                }
            }, 1000);
        });

        // Hide dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                document.getElementById('searchDropdown').style.display = 'none';
            }
        });

        function selectSearchResult(id, slug) {
            document.getElementById('searchDropdown').style.display = 'none';
            openDetail(id, slug);
        }

        document.getElementById('severityFilter').addEventListener('change', () => {
            currentPage = 1;
            fetchVault();
        });

        // Pagination Controls
        document.getElementById('prevPage').addEventListener('click', () => {
            if (currentPage > 1) { currentPage--; fetchVault(); }
        });
        document.getElementById('nextPage').addEventListener('click', () => {
            if (currentPage < totalPages) { currentPage++; fetchVault(); }
        });

        function updatePageInfo() {
            document.getElementById('pageInfo').innerText = `${dict[currentLang].page} ${currentPage} / ${totalPages || 1}`;
            document.getElementById('prevPage').disabled = currentPage <= 1;
            document.getElementById('nextPage').disabled = currentPage >= totalPages;
        }

        // Main Fetch
        async function fetchVault() {
            try {
                const search = document.getElementById('searchInput').value.trim();
                const severity = document.getElementById('severityFilter').value;
                
                let url = `${API_BASE}?lang=${currentLang}&page=${currentPage}&limit=20`;
                if (search) url += `&search=${encodeURIComponent(search)}`;
                if (severity) url += `&severity=${encodeURIComponent(severity)}`;

                const res = await fetch(url);
                const data = await res.json();
                
                totalPages = data.total_pages;
                updatePageInfo();
                renderGrid(data.items);
            } catch (err) {
                console.error("Failed to fetch vault items:", err);
            }
        }

        function processDateInfo(dateString) {
            if (!dateString) return { formatted: '', badgeText: '', hasBadge: false };
            const d = new Date(dateString.replace(' ', 'T'));
            const today = new Date();
            today.setHours(0,0,0,0);
            
            const itemDate = new Date(d);
            itemDate.setHours(0,0,0,0);
            
            const diffTime = today.getTime() - itemDate.getTime();
            const diffDays = Math.round(diffTime / (1000 * 3600 * 24));
            
            const dd = String(d.getDate()).padStart(2, '0');
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const yyyy = d.getFullYear();
            const formatted = `${dd}-${mm}-${yyyy}`;
            
            let badgeText = '';
            let hasBadge = false;
            
            if (diffDays <= 1) {
                badgeText = dict[currentLang].badgeNew;
                hasBadge = true;
            } else if (diffDays <= 7) {
                badgeText = dict[currentLang].badgeRecent;
                hasBadge = true;
            }
            
            return { formatted, badgeText, hasBadge };
        }

        function renderGrid(items) {
            const grid = document.getElementById('vaultGrid');
            grid.innerHTML = '';
            
            if (!items || items.length === 0) {
                grid.innerHTML = '<p>Không có kết quả nào.</p>';
                return;
            }

            items.forEach(item => {
                const sevRaw = (item.severity || '').toLowerCase();
                let severClass = "Medium"; // default
                
                if (sevRaw.includes("critical") || sevRaw.includes("nghiêm trọng") || sevRaw.includes("nghiem trong")) {
                    severClass = "Critical";
                } else if (sevRaw.includes("high") || sevRaw.includes("cao")) {
                    severClass = "High";
                }

                const dateInfo = processDateInfo(item.date_added);
                const t = dict[currentLang];
                const badgeHtml = dateInfo.hasBadge ? `<span class="date-badge ${dateInfo.badgeText === t.badgeNew ? 'new' : 'recent'}">${dateInfo.badgeText}</span>` : '';
                const dateHtml = dateInfo.formatted ? `<p style="font-size: 12px; color: #a6adc8; margin: 5px 0 0 0;">${t.dateAdded}: ${dateInfo.formatted}</p>` : '';

                grid.innerHTML += `
                    <div class="card" onclick="openDetail(${item.id}, '${item.slug}')">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;">
                            <span class="badge ${severClass}" style="margin-bottom: 0;">${item.severity || 'N/A'}</span>
                            ${badgeHtml}
                        </div>
                        <h3 style="margin:0 0 10px 0">${item.title}</h3>
                        <p style="font-size: 14px; color: #a6adc8; margin: 0;">${item.category}</p>
                        ${dateHtml}
                    </div>
                `;
            });
        }

        // Dynamic Modal Rendering
        function escapeHtml(unsafe) {
            if (typeof unsafe !== 'string') return unsafe;
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        function buildGroup(title, contentHtml, borderColor) {
            if (!contentHtml) return '';
            return `
                <div class="group-container" style="border-top: 3px solid ${borderColor}">
                    <h2 class="group-title" style="color: ${borderColor};">${title}</h2>
                    ${contentHtml}
                </div>
            `;
        }

        function buildSection(title, content, format = 'auto') {
            const emptyText = currentLang === 'vi' ? 'Không có thông tin' : 'No information available';
            
            if (!content || (Array.isArray(content) && content.length === 0) || content === '...' || (Array.isArray(content) && content.length === 1 && content[0] === '...')) {
                return `
                <div class="section-box">
                    <h3>${title}</h3>
                    <p style="color: #6c7086; font-style: italic; margin-top: 4px;">${emptyText}</p>
                </div>
                `;
            }

            let finalFormat = format;
            if (format === 'auto') {
                finalFormat = Array.isArray(content) ? 'list' : 'text';
            }

            let body = '';
            if (finalFormat === 'text') {
                body = `<p>${escapeHtml(content)}</p>`;
            } else {
                if (!Array.isArray(content)) content = [content];
                
                if (finalFormat === 'list') {
                    body = `<ul>${content.map(c => `<li>${escapeHtml(c)}</li>`).join('')}</ul>`;
                } else if (finalFormat === 'ordered') {
                    body = `<ol>${content.map(c => `<li>${escapeHtml(c)}</li>`).join('')}</ol>`;
                } else if (finalFormat === 'code') {
                    body = content.map(c => `<pre><code>${escapeHtml(c)}</code></pre>`).join('');
                } else if (finalFormat === 'links') {
                    body = `<ul>${content.map(c => `<li><a href="${escapeHtml(c)}" target="_blank" style="color: var(--accent);">${escapeHtml(c)}</a></li>`).join('')}</ul>`;
                }
            }

            return `
                <div class="section-box">
                    <h3>${title}</h3>
                    ${body}
                </div>
            `;
        }

        async function openDetail(id, slug) {
            try {
                if (slug) {
                    window.history.pushState(null, '', `?v=${slug}#${currentLang}`);
                }
                
                let data;
                if (detailCache[id]) {
                    data = detailCache[id];
                } else {
                    const res = await fetch(`${API_BASE}/${id}/content`);
                    data = await res.json();
                    detailCache[id] = data;
                }

                // Tiêu đề
                document.getElementById('m-title').innerText = data?.topic || data?.name || data?.title || 'Unknown';
                
                const g = dict[currentLang].groups;
                const t = dict[currentLang].fields;
                
                // Identification
                let iHtml = '';
                const iSrc = data?.identification || data;
                iHtml += buildSection(t.category, iSrc?.category, 'auto');
                iHtml += buildSection(t.cwe, iSrc?.cwe, 'auto');
                iHtml += buildSection(t.cve, iSrc?.cve, 'auto');
                iHtml += buildSection(t.severity, iSrc?.severity, 'auto');

                // Understanding
                let uHtml = '';
                const uSrc = data?.understanding || data; // Fallback to root for old schema
                uHtml += buildSection(t.description, uSrc?.description, 'auto');
                uHtml += buildSection(t.root_cause, uSrc?.root_cause, 'auto');
                uHtml += buildSection(t.mechanism, uSrc?.mechanism, 'auto');
                uHtml += buildSection(t.affected_systems, uSrc?.affected_systems, 'auto');
                uHtml += buildSection(t.affected_components, uSrc?.affected_components, 'auto');
                uHtml += buildSection(t.impact, uSrc?.impact, 'auto');
                uHtml += buildSection(t.attack_surface, uSrc?.attack_surface, 'auto');
                uHtml += buildSection(t.variants, uSrc?.variants, 'auto');
                
                // Exploitation
                let eHtml = '';
                const eSrc = data?.exploitation || data?.exploit || data;
                eHtml += buildSection(t.exploit_prerequisites, eSrc?.prerequisites, 'auto');
                eHtml += buildSection(t.exploit_flow, eSrc?.flow, 'ordered');
                eHtml += buildSection(t.exploit_payloads, eSrc?.payloads, 'code');
                
                // Defense
                let dHtml = '';
                const dSrc = data?.defense || data;
                dHtml += buildSection(t.defense_mitigation, dSrc?.mitigation, 'auto');
                dHtml += buildSection(t.defense_best_practices, dSrc?.best_practices, 'auto');
                dHtml += buildSection(t.defense_detection, dSrc?.detection, 'auto');
                dHtml += buildSection(t.defense_common_mistakes, dSrc?.common_mistakes, 'auto');

                // Lab
                let lHtml = '';
                const lSrc = data?.lab || data;
                lHtml += buildSection(t.lab_setup, lSrc?.setup, 'auto');
                lHtml += buildSection(t.lab_steps, lSrc?.steps, 'auto');
                lHtml += buildSection(t.lab_verification, lSrc?.verification, 'auto');

                // References & Meta
                let rHtml = '';
                rHtml += buildSection(t.references, data?.references, 'links');
                
                const mSrc = data?.meta || data;
                rHtml += buildSection(t.meta_difficulty, mSrc?.difficulty, 'auto');
                rHtml += buildSection(t.meta_frequency, mSrc?.frequency, 'auto');
                rHtml += buildSection(t.meta_tags, mSrc?.tags, 'auto');
                rHtml += buildSection(t.meta_notes, mSrc?.notes, 'auto');
                rHtml += buildSection(t.meta_related, mSrc?.related, 'auto');

                // Combine into Groups
                let finalHtml = '';
                finalHtml += buildGroup(g.identification, iHtml, '#f5c2e7');
                finalHtml += buildGroup(g.understanding, uHtml, 'var(--accent)');
                finalHtml += buildGroup(g.exploitation, eHtml, 'var(--danger)');
                finalHtml += buildGroup(g.defense, dHtml, 'var(--warning)');
                finalHtml += buildGroup(g.lab, lHtml, '#a6e3a1');
                finalHtml += buildGroup(g.meta, rHtml, '#cba6f7');

                document.getElementById('modalSections').innerHTML = finalHtml;

                document.getElementById('dl-md').href = `${API_BASE}/${id}/download?format=md`;
                document.getElementById('dl-json').href = `${API_BASE}/${id}/download?format=json`;

                document.getElementById('detailModal').style.display = 'flex';
            } catch (err) {
                console.error("Failed to load details:", err);
                alert("Could not load details.");
            }
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
            window.history.pushState(null, '', window.location.pathname);
        }

        // Bootstrap
        initThemeLang();
        
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('v');
            if (slug) {
                let hashLang = window.location.hash.replace('#', '');
                if (hashLang !== 'vi' && hashLang !== 'en') {
                    hashLang = 'en'; // default to english if invalid or missing
                }
                
                if (currentLang !== hashLang) {
                    currentLang = hashLang;
                    localStorage.setItem('lang', currentLang);
                    updateUIStrings();
                }
                
                fetch(`/api/vault/share/${encodeURIComponent(slug)}?lang=${currentLang}`)
                    .then(res => {
                        if (!res.ok) throw new Error("Not found");
                        return res.json();
                    })
                    .then(resData => {
                        detailCache[resData.id] = resData.content;
                        openDetail(resData.id, slug);
                    })
                    .catch(err => {
                        console.error("Failed to load shared URL:", err);
                        window.history.pushState(null, '', window.location.pathname);
                    });
            }
        });
        
        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
        
        document.getElementById('docModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeDocModal();
            }
        });

        // Doc & Feedback Logic
        const theDocCache = { vi: null, en: null };

        function openDocModal() {
            document.getElementById('docModal').style.display = 'flex';
            switchTab('doc');
        }

        function closeDocModal() {
            document.getElementById('docModal').style.display = 'none';
        }

        function switchTab(tab) {
            document.getElementById('tabDocBtn').classList.remove('active');
            document.getElementById('tabFeedbackBtn').classList.remove('active');
            document.getElementById('tab-doc').classList.remove('active');
            document.getElementById('tab-feedback').classList.remove('active');

            if (tab === 'doc') {
                document.getElementById('tabDocBtn').classList.add('active');
                document.getElementById('tab-doc').classList.add('active');
                loadDocContent();
            } else {
                document.getElementById('tabFeedbackBtn').classList.add('active');
                document.getElementById('tab-feedback').classList.add('active');
            }
        }

        async function loadDocContent() {
            document.getElementById('docLoading').style.display = 'block';
            document.getElementById('docContent').style.display = 'none';
            document.getElementById('docLoading').innerText = dict[currentLang].docLoading;

            if (!theDocCache[currentLang]) {
                try {
                    const res = await fetch(`/api/doc?lang=${currentLang}`);
                    theDocCache[currentLang] = await res.json();
                } catch (e) {
                    console.error(e);
                    document.getElementById('docLoading').innerText = currentLang === 'vi' ? "Lỗi tải tài liệu." : "Error loading doc.";
                    return;
                }
            }

            const data = theDocCache[currentLang];
            document.getElementById('docProjectName').innerText = data.project?.name || '';
            document.getElementById('docProjectDesc').innerText = data.project?.description || '';
            
            const updatedText = currentLang === 'vi' ? 'Cập nhật lần cuối: ' : 'Last updated: ';
            document.getElementById('docLastUpdated').innerText = data.last_updated ? updatedText + new Date(data.last_updated).toLocaleDateString() : '';
            
            document.getElementById('docMsgTitle').innerText = data.messages?.title || '';
            
            const msgs = data.messages?.content || [];
            document.getElementById('docMsgContent').innerHTML = msgs.map(m => `<p>${escapeHtml(m)}</p>`).join('');

            document.getElementById('docLoading').style.display = 'none';
            document.getElementById('docContent').style.display = 'block';
        }

        async function submitFeedback(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmitFeedback');
            btn.disabled = true;
            
            const title = document.getElementById('fbTitle').value;
            const content = document.getElementById('fbContent').value;
            
            try {
                const res = await fetch('/api/feedback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, content, lang: currentLang })
                });
                const data = await res.json();
                alert(data.message || 'Success');
                if (data.status === 'success') {
                    document.getElementById('feedbackForm').reset();
                }
            } catch (err) {
                console.error(err);
                alert(currentLang === 'vi' ? "Lỗi khi gửi góp ý." : "Error submitting feedback.");
            } finally {
                btn.disabled = false;
            }
        }
        
        fetchVault();
    </script>
</body>
</html>
